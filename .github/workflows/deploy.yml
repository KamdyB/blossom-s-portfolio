name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cancel stale portfolio deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          stale_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "Build and deploy portfolio" and .head_sha != env.CURRENT_SHA and .status != "completed") | .id] | .[]')
          if [ -n "$stale_ids" ]; then
            while read -r run_id; do
              [ -z "$run_id" ] || gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" || true
            done <<EOF
          $stale_ids
          EOF
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Prevent branch-based Pages output from overwriting the Vite build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing_count=0
          for attempt in $(seq 1 60); do
            run_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed") | .id] | .[]')
            if [ -z "$run_ids" ]; then
              missing_count=$((missing_count + 1))
              if [ "$missing_count" -ge 3 ]; then
                echo "No active branch-based Pages builds remain."
                exit 0
              fi
              sleep 5
              continue
            fi
            missing_count=0
            pending_build=0
            while read -r run_id; do
              [ -z "$run_id" ] && continue
              build_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build") | .status] | first // "missing"')
              if [ "$build_status" != "in_progress" ]; then
                echo "Cancelling queued or completed branch-based Pages run $run_id before publishing Vite output."
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" || true
              else
                pending_build=1
              fi
            done <<EOF
          $run_ids
          EOF
            if [ "$pending_build" -eq 0 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for branch-based Pages builds." >&2
          exit 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
