name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Prevent branch-based Pages output from overwriting the Vite build
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          missing_count=0
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == env.CURRENT_SHA)] | sort_by(.created_at) | last | .id // empty')
            if [ -z "$run_id" ]; then
              missing_count=$((missing_count + 1))
              if [ "$missing_count" -ge 3 ]; then
                echo "No branch-based Pages run found for this commit; continuing."
                exit 0
              fi
              sleep 5
              continue
            fi
            run_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.status')
            if [ "$run_status" = "completed" ]; then
              echo "The branch-based Pages workflow is already complete."
              exit 0
            fi
            build_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build") | .status] | first // "missing"')
            if [ "$build_status" = "completed" ]; then
              echo "Cancelling the branch-based deploy after its build, then publishing the Vite artifact."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" || true
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for the branch-based Pages build." >&2
          exit 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
