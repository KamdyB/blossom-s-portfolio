name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the branch-based Pages build to finish
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          missing_count=0
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == env.CURRENT_SHA)] | sort_by(.created_at) | last | .status // "missing"')
            if [ "$state" = "completed" ]; then
              echo "The competing Pages build has finished; publishing the Vite artifact last."
              exit 0
            fi
            if [ "$state" = "missing" ]; then
              missing_count=$((missing_count + 1))
              if [ "$missing_count" -ge 3 ]; then
                echo "No branch-based Pages build found for this commit; continuing."
                exit 0
              fi
            else
              missing_count=0
            fi
            sleep 5
          done
          echo "Timed out waiting for the branch-based Pages build." >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
