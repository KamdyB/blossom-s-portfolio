<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eaed" />
    <meta name="description" content="Wosu-Ezi Kamdirichukwu Blossom — software, data, and writing." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'light';
        try {
          var saved = localStorage.getItem('blossom-theme');
          theme = saved === 'light' || saved === 'dark' ? saved :
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (error) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.dataset.theme = theme;
        try {
          root.dataset.intro = !sessionStorage.getItem('blossom-intro-seen') &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'true' : 'false';
        } catch (error) {
          root.dataset.intro = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'false' : 'true';
        }
      })();
    </script>
    <title>Wosu-Ezi Kamdirichukwu Blossom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
